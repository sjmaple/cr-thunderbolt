<!doctype html>
<html lang="en">
  <head>
    <title>Offscreen</title>
  </head>
  <body>
    <!-- The toolbar cannot wrap or scroll, so Save sticks out past the right edge. -->
    <div style="position: fixed; bottom: 0; left: 0; right: 0; display: flex; overflow: hidden">
      <button style="flex: none; width: 1000px">Discard</button>
      <button style="flex: none; width: 500px">Save</button>
    </div>
  </body>
</html>
